name: Continuous Integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # pytype (see .pre-commit-config.yaml) supports Python 3.12 at most.
          python-version: "3.12"
      # The pytype hook is `language: system`: it needs pytype and the
      # project's dependencies installed in the environment pre-commit runs in.
      - name: Install pytype and project dependencies
        run: python -m pip install pytype==2024.10.11 pytest -r requirements.txt
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - name: Run tests
        run: python -m pytest
